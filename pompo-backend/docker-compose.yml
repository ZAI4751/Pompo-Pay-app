services:
  postgres:
    image: postgres:16-alpine
    container_name: pompo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pompo
      POSTGRES_PASSWORD: pompo_secret
      POSTGRES_DB: pompo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pompo -d pompo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pompo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pompo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://pompo:pompo_secret@postgres:5432/pompo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pompo-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://pompo:pompo_secret@postgres:5432/pompo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # Overrides the image-level HEALTHCHECK baked into docker/Dockerfile
      # (curl against port 8000), which this service inherits by default
      # since it builds from the same Dockerfile as `backend` but is not an
      # HTTP server. `celery inspect ping` sends a broadcast control message
      # over the broker (Redis) to this worker and waits for a "pong" reply
      # — it verifies the worker process is actually alive and responsive to
      # Celery's control bus, not merely that a process with the right name
      # exists. Verified locally: passes (exit 0) against a running worker,
      # fails (nonzero) once the worker process is killed.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  adminer:
    image: adminer:4
    container_name: pompo-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
  redis_data:
