services:
  postgres:
    image: postgres:16-alpine
    container_name: pompo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pompo
      POSTGRES_PASSWORD: pompo_secret
      POSTGRES_DB: pompo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pompo -d pompo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pompo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pompo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://pompo:pompo_secret@postgres:5432/pompo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # "*" so Expo Go on a physical phone can call the API via the LAN IP
      # (Host: 192.168.x.x). Production must set an explicit host list.
      ALLOWED_HOSTS: "*"
      # The admin frontend is opened as either host name locally, and the two
      # are distinct origins to a browser. Set here rather than in .env so the
      # development contract is version-controlled; `environment` also takes
      # precedence over `env_file`, which is what makes this authoritative.
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # One dashboard screen issues many calls, and inside Docker every request
      # from the host shares the gateway's IP — so a single bucket covers the
      # whole development session. Production keeps the restrictive default.
      RATE_LIMIT_REQUESTS: "1000"
    volumes:
      # docker/Dockerfile bakes the source in with `COPY . .`, so without these
      # mounts `docker compose exec backend pytest` silently runs whatever was
      # in the image at build time. Since the Docker environment is the
      # acceptance environment for PostgreSQL integration tests, it has to see
      # the working tree. Specific subtrees, not the whole context, so the
      # image's installed dependencies are never shadowed.
      - ./app:/app/app
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pompo-celery-worker
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://pompo:pompo_secret@postgres:5432/pompo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
    healthcheck:
      # Overrides the image-level HEALTHCHECK baked into docker/Dockerfile
      # (curl against port 8000), which this service inherits by default
      # since it builds from the same Dockerfile as `backend` but is not an
      # HTTP server. `celery inspect ping` sends a broadcast control message
      # over the broker (Redis) to this worker and waits for a "pong" reply
      # — it verifies the worker process is actually alive and responsive to
      # Celery's control bus, not merely that a process with the right name
      # exists. Verified locally: passes (exit 0) against a running worker,
      # fails (nonzero) once the worker process is killed.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  adminer:
    image: adminer:4
    container_name: pompo-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
  redis_data:
