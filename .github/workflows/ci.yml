name: CI

on:
  push:
    branches:
      - Main-Pompo-branch
  pull_request:
    branches:
      - Main-Pompo-branch

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pompo-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pompo
          POSTGRES_PASSWORD: pompo_secret
          POSTGRES_DB: pompo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pompo -d pompo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      ALLOWED_HOSTS: "*"
      SECRET_KEY: test-secret-key-minimum-32-characters-long-for-ci
      JWT_SECRET_KEY: test-jwt-secret-key-minimum-32-characters-long
      DATABASE_URL: postgresql+asyncpg://pompo:pompo_secret@localhost:5432/pompo_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pompo-backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create test database
        run: |
          python scripts/create_test_db.py \
            --url postgresql://pompo:pompo_secret@localhost:5432/postgres \
            --database pompo_test

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -f docker/Dockerfile .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pompo-frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: https://pompo-api-production.up.railway.app/api/v1
      NEXT_PUBLIC_USE_MOCKS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pompo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
